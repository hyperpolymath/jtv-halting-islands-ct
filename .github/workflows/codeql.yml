# This workflow is managed by gh actions-lock.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning requires GitHub Advanced Security on private
    # repositories. This one does not have it, so every CodeQL run ended with
    # "Code scanning is not enabled for this repository" — it has never worked
    # and cannot while the repo stays private.
    #
    # A skipped job still reports a check run (conclusion `skipped`), which
    # GitHub treats as satisfied for required status checks, so this creates no
    # phantom. It also self-heals: make the repository public and the job
    # starts running again with no workflow edit.
    if: ${{ !github.event.repository.private }}
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3.37.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
